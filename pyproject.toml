[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "map"
version = "0.1.0"
description = "AI-Native Attention Programming Shell - A homoiconic Lisp for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Isaac", email = "isaac@example.com"}]
keywords = ["lisp", "homoiconic", "metaprogramming", "ai", "attention", "self-modifying"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
map = "map.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
